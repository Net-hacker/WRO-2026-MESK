<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/iro.js/5.5.1/iro.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.js"></script>
  <style>
    .slider { margin: 10px 0; width: 250px; }
  </style>
</head>
<body>
  <div id="sliderPicker"></div>

  <div id="hueSlider" class="slider"></div>
  <div id="saturationSlider" class="slider"></div>
  <div id="valueSlider" class="slider"></div>

  <script>
    // ColorPicker
    var colorPicker = new iro.ColorPicker("#sliderPicker", {
      width: 250,
      color: "rgb(255, 0, 0)",
      borderWidth: 1,
      borderColor: "#fff"
    });

    // Dual-Handle-Slider
    noUiSlider.create(document.getElementById("hueSlider"), {
      start: [0, 360], connect: true, range: { min: 0, max: 360 }
    });
    noUiSlider.create(document.getElementById("saturationSlider"), {
      start: [0, 100], connect: true, range: { min: 0, max: 100 }
    });
    noUiSlider.create(document.getElementById("valueSlider"), {
      start: [0, 100], connect: true, range: { min: 0, max: 100 }
    });
  </script>
</body>
</html>
