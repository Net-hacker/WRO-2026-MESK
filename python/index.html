<!DOCTYPE html>
<html lang="en">
<head>

    <title>Kamera HTTP Server</title>
</head>

    <button id="LiveB" onclick="showLive()">Live</button>
    <div id="stream"></div>
    <script>
      const container = document.getElementById("stream");

      function showResult() {
        const streamR = document.createElement("img");
        streamR.src = "http://localhost:5000/video_res";

        if ([...container.children].includes(streamL)) {
          container.removeChild(streamL);
        } else if ([...container.children].includes(streamR)) {
          container.removeChild(streamR);
        }
        container.appendChild(streamR);
      }

      function showLive() {
        const streamL = document.createElement("img");
        streamL.src = "http://localhost:5000/video";

        if ([...container.children].includes(streamR)) {

        } else if ([...container.children].includes(streamL)) {
          container.removeChild(streamL);
        }
        container.appendChild(streamL);
      }
    </script>
</body>
</html>
