<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera HTTP Server</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }

      body {
        background: #0f1115;
        color: #e6e6e6;
        padding: 24px;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      button {
        background: #1c2230;
        color: #e6e6e6;
        border: 1px solid #2c3447;
        padding: 10px 14px;
        margin: 6px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-weight: 500;
      }

      button:hover {
        background: #2a3246;
        transform: translateY(-1px);
      }

      button:active {
        transform: scale(0.98);
      }

      .container {
        display: flex;
        gap: 20px;
        margin-top: 20px;
        align-items: flex-start;
        justify-content: center;
        flex-wrap: wrap;
      }

      /* Stream area */
      #stream {
        flex: 1;
        min-width: 320px;
        min-height: 240px;
        background: #151a23;
        border: 1px solid #2a3246;
        border-radius: 14px;
        padding: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Stream images */
      #stream img {
        max-width: 100%;
        border-radius: 10px;
        border: 1px solid #2a3246;
      }

      /* Right panel */
      .container > div:last-child {
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #151a23;
        padding: 14px;
        border-radius: 14px;
        border: 1px solid #2a3246;
        min-width: 300px;
      }

      /* Border buttons */
      .container button[id] {
        width: 60px;
        text-align: center;
      }

      /* Color pickers */
      #picker,
      #picker2 {
        margin-top: 10px;
        padding: 10px;
        background: #0f1115;
        border: 1px solid #2a3246;
        border-radius: 12px;
      }

      /* Output text */
      #output {
        margin-top: 10px;
        padding: 8px 12px;
        background: #0f1115;
        border: 1px solid #2a3246;
        border-radius: 10px;
        font-family: monospace;
        text-align: center;
      }

      /* Top buttons */
      #ResultB,
      #LiveB {
        display: inline-block;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5/dist/iro.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.js"></script>
</head>
<body>
    <h1>Live Kamera Stream</h1>
    <button id="ResultB" onclick="showResult()">Result</button>
    <button id="LiveB" onclick="showLive()">Live</button>
    <div class="container">
      <div id="stream"></div>
      <div >
        <button id="1" onclick="change_border(this.id)">1</button>
        <button id="2" onclick="change_border(this.id)">2</button>
        <button id="3" onclick="change_border(this.id)">3 (temp)</button>
        <div id="picker"></div>
        <div id="picker2"></div>
        <p id="output">50</p>
      </div>
    </div>
    <script>
      const container = document.getElementById("stream");
      const slider = document.getElementById("slider");
      const output = document.getElementById("output");
      var ColorPicker = new iro.ColorPicker("#picker", {
        width: 250,
        color: "rgb(255, 0, 0)",
        borderWidth: 1,
        borderColor: "#fff",
        layout: [
          {
            component: iro.ui.Slider,
            options: {
              sliderType: 'hue'
            }
          },
          {
            component: iro.ui.Slider,
            options: {
              sliderType: 'saturation'
            }
          },
          {
            component: iro.ui.Slider,
            options: {
              sliderType: 'value'
            }
          }
        ]
      });
      var ColorPicker2 = new iro.ColorPicker("#picker2", {
        width: 250,
        color: "rgb(255, 0, 0)",
        borderWidth: 1,
        borderColor: "#fff",
        layout: [
          {
            component: iro.ui.Slider,
            options: {
              sliderType: 'hue'
            }
          },
          {
            component: iro.ui.Slider,
            options: {
              sliderType: 'saturation'
            }
          },
          {
            component: iro.ui.Slider,
            options: {
              sliderType: 'value'
            }
          }
        ]
      });

      let Mask = 1;
      let ignore_event = false;

      ColorPicker.on('color:change', function(color) {
        if (ignore_event) return;
        const h = Math.round(color.hsv.h);
        const s = Math.round(color.hsv.s);
        const v = Math.round(color.hsv.v);
        output.textContent = `${h}, ${s}, ${v}`;
        const border = Mask + "1";
        fetch(`/set_value?value=${h}, ${s}, ${v}&id=${border}`)
          .then(response => response.text())
          .then(response => console.log(response))
      });

      ColorPicker2.on('color:change', function(color) {
        if (ignore_event) return;
        const h = Math.round(color.hsv.h);
        const s = Math.round(color.hsv.s);
        const v = Math.round(color.hsv.v);
        output.textContent = `${h}, ${s}, ${v}`;
        const border = Mask + "2";
        fetch(`/set_value?value=${h}, ${s}, ${v}&id=${border}`)
          .then(response => response.text())
          .then(response => console.log(response))
      });

      ColorPicker2.on('color:change', function(color) {
        if (ignore_event) return;
        const h = Math.round(color.hsv.h);
        const s = Math.round(color.hsv.s);
        const v = Math.round(color.hsv.v);
        output.textContent = `${h}, ${s}, ${v}`;
        const border = Mask + "2";
        fetch(`/set_value?value=${h}, ${s}, ${v}&id=${border}`)
          .then(response => response.text())
          .then(response => console.log(response))
      });

      function change_border(id) {
        ignore_event = true;
        Mask = id;
        let colors;
        fetch(`/get_value?id=${id + "1"}`)
          .then(response => response.text())
            .then(response => {
            console.log(response);
            colors = response.split(",").map(Number);
            console.log(colors);
            ColorPicker.color.set({ h: colors[0], s: colors[1], v: colors[2] });
            ignore_event = false;
            const h = Math.round(ColorPicker.color.hsv.h);
            const s = Math.round(ColorPicker.color.hsv.s);
            const v = Math.round(ColorPicker.color.hsv.v);
            output.textContent = `${h}, ${s}, ${v}`;
            console.log("Border geändert")
          }
        )
        fetch(`/get_value?id=${id + "2"}`)
          .then(response => response.text())
            .then(response => {
            console.log(response);
            colors = response.split(",").map(Number);
            console.log(colors);
            ColorPicker2.color.set({ h: colors[0], s: colors[1], v: colors[2] });
            ignore_event = false;
            const h = Math.round(ColorPicker.color.hsv.h);
            const s = Math.round(ColorPicker.color.hsv.s);
            const v = Math.round(ColorPicker.color.hsv.v);
            output.textContent = `${h}, ${s}, ${v}`;
            console.log("Border geändert")
          }
        )
      }

      function showResult() {
        const existingR = document.getElementById("streamR");
        const existingL = document.getElementById("streamL");
        if (existingL) container.removeChild(existingL);
        if (existingR) { container.removeChild(existingR); return; }
        const streamR = document.createElement("img");
        streamR.id = "streamR";
        streamR.src = "/video_res";
        container.appendChild(streamR);
      }

      function showLive() {
        const existingR = document.getElementById("streamR");
        const existingL = document.getElementById("streamL");
        if (existingR) container.removeChild(existingR);
        if (existingL) { container.removeChild(existingL); return; }
        const streamL = document.createElement("img");
        streamL.id = "streamL";
        streamL.src = "/video";
        container.appendChild(streamL);
      }

    </script>
</body>
</html>
